<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>500 서버 오류 &middot; 코딱지</title>
  <style>
    :root{--bg:#e9eff8;--panel:#f8fbff;--ink:#18374d;--muted:#5a7389;--line:#cbdce9;--accent:#00808d}
    @media (prefers-color-scheme:dark){:root{--bg:#031826;--panel:#082a3c;--ink:#e0f3fc;--muted:#9db7c9;--line:#194154;--accent:#00d5dc}}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:14px/1.7 'Malgun Gothic',system-ui,sans-serif}
    main{width:100%;max-width:520px;padding:40px 32px;background:var(--panel);border:1px solid var(--line);border-radius:16px;text-align:center}
    .code{display:block;font-size:56px;font-weight:800;letter-spacing:-2px;color:var(--accent);line-height:1.1}
    h1{font-size:22px;margin:12px 0 8px}
    p{color:var(--muted);margin:0 0 24px}
    a{display:inline-block;padding:10px 18px;border-radius:8px;background:var(--accent);color:#012932;font-weight:bold;text-decoration:none}
  </style>
</head>
<body>
<main>
  <span class="code">500</span>
  <h1>서버에 문제가 생겼습니다</h1>
  <p>요청을 처리하는 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요. 계속되면 서버 담당자에게 알려주세요.</p>
  <a href="/">처음 화면으로</a>
</main>
</body>
</html>
