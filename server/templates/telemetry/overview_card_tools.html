<span class="card-tools">
  <span class="edit-tools" role="group" aria-label="카드 배치">
    <span class="drag-grip" aria-hidden="true">{% include 'accounts/nav_icon.html' with icon='grip' %}</span>
    <button type="button" class="tool-btn" data-move="-1" aria-label="앞으로 옮기기" title="앞으로">{% include 'accounts/nav_icon.html' with icon='up' %}</button>
    <button type="button" class="tool-btn" data-move="1" aria-label="뒤로 옮기기" title="뒤로">{% include 'accounts/nav_icon.html' with icon='down' %}</button>
    <button type="button" class="tool-btn" data-resize aria-label="카드 너비 바꾸기" title="너비">{% include 'accounts/nav_icon.html' with icon='width' %}</button>
  </span>
  <button type="button" class="tool-btn" data-card-expand aria-label="크게 보기" title="크게 보기">{% include 'accounts/nav_icon.html' with icon='expand' %}</button>
</span>
