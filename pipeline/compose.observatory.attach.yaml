name: nodeverse-observatory
services:
  observatory:
    build:
      context: .
      dockerfile: Dockerfile.observatory
    restart: unless-stopped
    ports:
      - '${OBSERVATORY_BIND:-127.0.0.1}:${OBSERVATORY_PORT:-8011}:8011'
    env_file:
      - path: .env.remote
        required: false
    environment:
      MONGO_URI: '${OBSERVATORY_MONGO_URI:-mongodb://nodeverse-v2-live-mongo-1:27017}'
      MONGO_DB: '${OBSERVATORY_MONGO_DB:-nodeverse_logs}'
      MONGO_TIMEOUT_MS: '1000'
      PROGRESS_PATH: /data/metrics/streaming-progress.json
      OBSERVATORY_COLLECTOR_URL: '${OBSERVATORY_COLLECTOR_URL:-http://nodeverse-v2-live-collector-1:8000}'
      OBSERVATORY_NAME: '${OBSERVATORY_NAME:-LOCAL / nodeverse-v2-live}'
      OBSERVATORY_INTERVAL_S: '${OBSERVATORY_INTERVAL_S:-10}'
      OBSERVATORY_KEY: '${OBSERVATORY_KEY:-}'
      OBSERVATORY_BIND: '${OBSERVATORY_BIND:-127.0.0.1}'
    volumes:
      - source-lake:/data:ro
    networks:
      - source
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8011/health", timeout=3)']
      interval: 15s
      timeout: 5s
      retries: 3
volumes:
  source-lake:
    external: true
    name: '${OBSERVATORY_LAKE_VOLUME:-nodeverse-v2-live_lake}'
networks:
  source:
    external: true
    name: '${OBSERVATORY_NETWORK_NAME:-nodeverse-v2-live_default}'
