# Overlay for an existing nodeverse-v2-live project. Preserve its volumes and private settings.
# PIPELINE_SOURCE_ROOT must point to this repository's pipeline directory (use forward slashes on Windows).
services:
  collector:
    image: ${PIPELINE_APP_IMAGE:?Set PIPELINE_APP_IMAGE to the image built from this checkout}
  remote-writer:
    image: ${PIPELINE_APP_IMAGE:?Set PIPELINE_APP_IMAGE to the image built from this checkout}
    environment:
      REMOTE_MEMBER_CACHE_SECONDS: ${REMOTE_MEMBER_CACHE_SECONDS:-0}
  spark:
    command:
      - --master
      - local[${SPARK_CORES:-4}]
      - --driver-memory
      - ${SPARK_DRIVER_MEMORY:-2g}
      - --conf
      - spark.jars.ivy=/ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.3,io.delta:delta-spark_2.12:3.2.1
      - --conf
      - spark.sql.extensions=io.delta.sql.DeltaSparkSessionExtension
      - --conf
      - spark.sql.catalog.spark_catalog=org.apache.spark.sql.delta.catalog.DeltaCatalog
      - --conf
      - spark.sql.warehouse.dir=/data/delta
      - --conf
      - spark.sql.session.timeZone=UTC
      - --py-files
      - /app/tables.py,/app/audit_state.py,/app/sinks.py,/app/compaction.py,/app/bronze.py,/app/silver.py,/app/gold.py,/app/periodic.py
      - /app/delta_stream.py
    volumes:
      - ${PIPELINE_SOURCE_ROOT:?Set PIPELINE_SOURCE_ROOT}/spark:/app:ro
      - ${PIPELINE_SOURCE_ROOT:?Set PIPELINE_SOURCE_ROOT}/common:/opt/nodeverse/common:ro
      - ${PIPELINE_SOURCE_ROOT:?Set PIPELINE_SOURCE_ROOT}/remote:/opt/nodeverse/remote:ro
