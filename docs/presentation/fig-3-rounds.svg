<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="'Malgun Gothic','Apple SD Gothic Neo',sans-serif"><defs><marker id="md" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f6f4f"/></marker><marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b78c2"/></marker></defs><rect width="1920" height="1080" fill="#ffffff"/><text x="60" y="78" font-size="44" font-weight="800" fill="#1f2430">③ 보완 차수별 변경점 (1~7차)</text><text x="60" y="122" font-size="22" fill="#5b6472">각 차수의 핵심 변경과 그 차수에서 직접 잰 대표 결과</text><rect x="60" y="200" width="248" height="760" rx="16" fill="#fafbfc" stroke="#2f8a57" stroke-width="3"/><rect x="60" y="200" width="248" height="96" rx="16" fill="#2f8a57"/><rect x="60" y="270" width="248" height="26" fill="#2f8a57"/><text x="184.0" y="248" font-size="36" font-weight="800" fill="#fff" text-anchor="middle" xml:space="preserve">1차</text><text x="184.0" y="284" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">구조·처리량</text><text x="78" y="350" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">Spark 모듈 분리,</text><text x="78" y="380" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">쿼리별 재시작</text><text x="78" y="424" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">sink 재시도,</text><text x="78" y="454" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">MERGE 7일+v7</text><text x="78" y="484" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">범위</text><text x="78" y="528" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">원격 적재 묶음·세션</text><text x="78" y="558" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">병렬·연결 풀</text><line x1="76" y1="760" x2="292" y2="760" stroke="#d5dae1" stroke-width="2"/><text x="78" y="800" font-size="17" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">실측</text><text x="78" y="836" font-size="21" font-weight="800" fill="#2f8a57" text-anchor="start" xml:space="preserve">원격 적재 17~24</text><text x="78" y="868" font-size="21" font-weight="800" fill="#2f8a57" text-anchor="start" xml:space="preserve">→ 60~90건/초</text><path d="M309,580 L321,580" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><rect x="322" y="200" width="248" height="760" rx="16" fill="#fafbfc" stroke="#3b78c2" stroke-width="3"/><rect x="322" y="200" width="248" height="96" rx="16" fill="#3b78c2"/><rect x="322" y="270" width="248" height="26" fill="#3b78c2"/><text x="446.0" y="248" font-size="36" font-weight="800" fill="#fff" text-anchor="middle" xml:space="preserve">2차</text><text x="446.0" y="284" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">멈춘 이벤트 (PL-9)</text><text x="340" y="350" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">대기·재시도 기한 →</text><text x="340" y="380" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">parked</text><text x="340" y="424" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">자동 재개,</text><text x="340" y="454" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">requeue 도구</text><text x="340" y="498" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">적재 상태 카드, 30일</text><text x="340" y="528" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">TTL</text><line x1="338" y1="760" x2="554" y2="760" stroke="#d5dae1" stroke-width="2"/><text x="340" y="800" font-size="17" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">실측</text><text x="340" y="836" font-size="21" font-weight="800" fill="#3b78c2" text-anchor="start" xml:space="preserve">쉬는 중 무한 재시도</text><text x="340" y="868" font-size="21" font-weight="800" fill="#3b78c2" text-anchor="start" xml:space="preserve">CPU 143% 제거</text><path d="M571,580 L583,580" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><rect x="584" y="200" width="248" height="760" rx="16" fill="#fafbfc" stroke="#2f8a57" stroke-width="3"/><rect x="584" y="200" width="248" height="96" rx="16" fill="#2f8a57"/><rect x="584" y="270" width="248" height="26" fill="#2f8a57"/><text x="708.0" y="248" font-size="36" font-weight="800" fill="#fff" text-anchor="middle" xml:space="preserve">3차</text><text x="708.0" y="284" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">CPU 경량화 + PL-8</text><text x="602" y="350" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">헬스체크</text><text x="602" y="380" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">JVM·mongosh</text><text x="602" y="410" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">제거</text><text x="602" y="454" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">rt_summary 5분</text><text x="602" y="484" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">필터, 버전 변경 시만</text><text x="602" y="514" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">쓰기</text><text x="602" y="558" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">상태 집계 인덱스만,</text><text x="602" y="588" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">DLQ 카드</text><line x1="600" y1="760" x2="816" y2="760" stroke="#d5dae1" stroke-width="2"/><text x="602" y="800" font-size="17" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">실측</text><text x="602" y="836" font-size="21" font-weight="800" fill="#2f8a57" text-anchor="start" xml:space="preserve">Kafka p95</text><text x="602" y="868" font-size="21" font-weight="800" fill="#2f8a57" text-anchor="start" xml:space="preserve">120→6%,</text><text x="602" y="900" font-size="21" font-weight="800" fill="#2f8a57" text-anchor="start" xml:space="preserve">Mongo 39→5%</text><path d="M833,580 L845,580" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><rect x="846" y="200" width="248" height="760" rx="16" fill="#fafbfc" stroke="#3b78c2" stroke-width="3"/><rect x="846" y="200" width="248" height="96" rx="16" fill="#3b78c2"/><rect x="846" y="270" width="248" height="26" fill="#3b78c2"/><text x="970.0" y="248" font-size="36" font-weight="800" fill="#fff" text-anchor="middle" xml:space="preserve">4차</text><text x="970.0" y="284" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">신뢰성 P1 + 헬스체크</text><text x="864" y="350" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">선점 토큰, 순번 복구,</text><text x="864" y="380" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">무한 대기 격리</text><text x="864" y="424" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">재처리 예산,</text><text x="864" y="454" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">archive 재검증</text><text x="864" y="498" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">Gold 재게시,</text><text x="864" y="528" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">프로토콜 헬스체크</text><line x1="862" y1="760" x2="1078" y2="760" stroke="#d5dae1" stroke-width="2"/><text x="864" y="800" font-size="17" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">실측</text><text x="864" y="836" font-size="21" font-weight="800" fill="#3b78c2" text-anchor="start" xml:space="preserve">Mongo 130초</text><text x="864" y="868" font-size="21" font-weight="800" fill="#3b78c2" text-anchor="start" xml:space="preserve">정지에도 재시작 0</text><path d="M1095,580 L1107,580" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><rect x="1108" y="200" width="248" height="760" rx="16" fill="#fafbfc" stroke="#b8506a" stroke-width="3"/><rect x="1108" y="200" width="248" height="96" rx="16" fill="#b8506a"/><rect x="1108" y="270" width="248" height="26" fill="#b8506a"/><text x="1232.0" y="248" font-size="36" font-weight="800" fill="#fff" text-anchor="middle" xml:space="preserve">5차</text><text x="1232.0" y="284" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">게임·P2 시험</text><text x="1126" y="350" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">디스크 큐 원자적</text><text x="1126" y="380" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">쓰기·손상 보관</text><text x="1126" y="424" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">계정 전환 시 새 세션</text><text x="1126" y="468" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">역순·중복·조회·ZORDER</text><text x="1126" y="498" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">시험</text><line x1="1124" y1="760" x2="1340" y2="760" stroke="#d5dae1" stroke-width="2"/><text x="1126" y="800" font-size="17" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">실측</text><text x="1126" y="836" font-size="21" font-weight="800" fill="#b8506a" text-anchor="start" xml:space="preserve">6,000건·역순</text><text x="1126" y="868" font-size="21" font-weight="800" fill="#b8506a" text-anchor="start" xml:space="preserve">30세션 섞임·누락 0</text><path d="M1357,580 L1369,580" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><rect x="1370" y="200" width="248" height="760" rx="16" fill="#fafbfc" stroke="#c47a12" stroke-width="3"/><rect x="1370" y="200" width="248" height="96" rx="16" fill="#c47a12"/><rect x="1370" y="270" width="248" height="26" fill="#c47a12"/><text x="1494.0" y="248" font-size="36" font-weight="800" fill="#fff" text-anchor="middle" xml:space="preserve">6차</text><text x="1494.0" y="284" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">데이터 증가 대비</text><text x="1388" y="350" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">자동 압축 → 주기 압축</text><text x="1388" y="394" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">VACUUM 6시간</text><text x="1388" y="424" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">(별도 스레드)</text><text x="1388" y="468" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">event_id</text><text x="1388" y="498" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">ZORDER 비교 (현행</text><text x="1388" y="528" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">유지)</text><line x1="1386" y1="760" x2="1602" y2="760" stroke="#d5dae1" stroke-width="2"/><text x="1388" y="800" font-size="17" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">실측</text><text x="1388" y="836" font-size="21" font-weight="800" fill="#c47a12" text-anchor="start" xml:space="preserve">Silver MERGE</text><text x="1388" y="868" font-size="21" font-weight="800" fill="#c47a12" text-anchor="start" xml:space="preserve">5.35 → 1.55초</text><path d="M1619,580 L1631,580" fill="none" stroke="#2f6f4f" stroke-width="3.5" marker-end="url(#md)"/><rect x="1632" y="200" width="248" height="760" rx="16" fill="#fafbfc" stroke="#6b4fb8" stroke-width="3"/><rect x="1632" y="200" width="248" height="96" rx="16" fill="#6b4fb8"/><rect x="1632" y="270" width="248" height="26" fill="#6b4fb8"/><text x="1756.0" y="248" font-size="36" font-weight="800" fill="#fff" text-anchor="middle" xml:space="preserve">7차</text><text x="1756.0" y="284" font-size="19" font-weight="700" fill="#fff" text-anchor="middle" xml:space="preserve">늦게 도착한 데이터</text><text x="1650" y="350" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">늦게 도착 건수 표시</text><text x="1650" y="394" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">경고는 정시 이벤트만</text><text x="1650" y="438" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">MERGE ID 생성일별</text><text x="1650" y="468" font-size="19" font-weight="400" fill="#1f2430" text-anchor="start" xml:space="preserve">분리, 버전 보급률</text><line x1="1648" y1="760" x2="1864" y2="760" stroke="#d5dae1" stroke-width="2"/><text x="1650" y="800" font-size="17" font-weight="700" fill="#5b6472" text-anchor="start" xml:space="preserve">실측</text><text x="1650" y="836" font-size="21" font-weight="800" fill="#6b4fb8" text-anchor="start" xml:space="preserve">사흘 전 602건</text><text x="1650" y="868" font-size="21" font-weight="800" fill="#6b4fb8" text-anchor="start" xml:space="preserve">경고에서만 제외</text></svg>